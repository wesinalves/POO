{% extends 'base.html' %}
{% block menu %}
<a href="{% url 'polls:index' %}">Home</a>
{% endblock menu %}
{% block main %}
<h2>Confirmar exclusão de questão</h2>
<form method="post">
    {% csrf_token %}
    <p>Tem certeza que deseja excluir a questão "{{ object.question_text }}"?</p>
    <div class="flex gap-3">
    <button type="submit" value="Confirmar" class="block bg-red-800 px-3 py-3 rounded-md mt-3 text-white">Sim</button>
    <a href="{% url 'polls:detail' question.id %}" class="bg-gray-500 px-3 py-3 rounded-md mt-3 text-white text-center mt-3">Não</a>
    </div>
</form>
{% endblock main %}
